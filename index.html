<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>技能値補正計算</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #cbd5e1; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #cbd5e1; cursor: pointer; border: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback } = React;

function calculateSuccessProb(skillValue, netDice) {
  if (skillValue <= 0) return 0;
  if (skillValue >= 100) return 1;

  const k = Math.abs(netDice) + 1;
  const isBonus = netDice > 0;

  if (netDice === 0) return skillValue / 100;

  let totalProb = 0;
  for (let u = 0; u <= 9; u++) {
    let probGivenU;
    if (u === 0) {
      const T = Math.floor(skillValue / 10);
      if (T < 1) {
        probGivenU = 0;
      } else if (isBonus) {
        probGivenU = 1 - Math.pow((10 - T) / 10, k);
      } else {
        probGivenU = Math.pow(T / 10, k);
      }
    } else {
      if (skillValue < u) {
        probGivenU = 0;
      } else {
        const threshold = Math.floor((skillValue - u) / 10);
        if (isBonus) {
          probGivenU = threshold >= 9 ? 1 : 1 - Math.pow((9 - threshold) / 10, k);
        } else {
          probGivenU = threshold >= 9 ? 1 : Math.pow((threshold + 1) / 10, k);
        }
      }
    }
    totalProb += probGivenU / 10;
  }
  return totalProb;
}

function App() {
  const [skillValue, setSkillValue] = useState(null);
  const [skillInput, setSkillInput] = useState("");
  const [netDice, setNetDice] = useState(0);
  const [diceInput, setDiceInput] = useState("0");
  const [showRef, setShowRef] = useState(false);
  const [copyToast, setCopyToast] = useState(false);

  const hasSkill = skillValue !== null && skillValue >= 1 && skillValue <= 99;

  const results = useMemo(() => {
    if (!hasSkill) return null;
    const prob = calculateSuccessProb(skillValue, netDice);
    const deltaRaw = prob * 100 - skillValue;
    const delta = Math.round(deltaRaw * 100) / 100;
    const correction = Math.floor(delta);
    const corrected = Math.max(1, Math.min(99, skillValue + correction));

    return {
      prob,
      delta,
      correction,
      corrected,
      hard: { prob: calculateSuccessProb(Math.floor(skillValue / 2), netDice), threshold: Math.floor(skillValue / 2) },
      extreme: { prob: calculateSuccessProb(Math.floor(skillValue / 5), netDice), threshold: Math.floor(skillValue / 5) },
      critical: calculateSuccessProb(1, netDice) * 100,
      fumble: (1 - calculateSuccessProb(99, netDice)) * 100,
    };
  }, [skillValue, netDice, hasSkill]);

  const handleCopy = useCallback(() => {
    if (!hasSkill || !results || netDice === 0) return;
    const sign = results.correction >= 0 ? `+${results.correction}` : `${results.correction}`;
    const text = `CCB<=${skillValue}${sign}`;
    const doCopy = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          setCopyToast(true);
          setTimeout(() => setCopyToast(false), 1800);
        }).catch(() => {
          doCopy();
          setCopyToast(true);
          setTimeout(() => setCopyToast(false), 1800);
        });
      } else {
        doCopy();
        setCopyToast(true);
        setTimeout(() => setCopyToast(false), 1800);
      }
    } catch (e) {
      doCopy();
      setCopyToast(true);
      setTimeout(() => setCopyToast(false), 1800);
    }
  }, [hasSkill, results, skillValue, netDice]);

  const diceLabel = netDice === 0
    ? "通常ロール"
    : netDice > 0
      ? `ボーナスダイス ×${netDice}`
      : `ペナルティダイス ×${Math.abs(netDice)}`;
  const diceColor = netDice === 0 ? "#94a3b8" : netDice > 0 ? "#6ee7b7" : "#fca5a5";

  const showResults = hasSkill && netDice !== 0 && results;

  return (
    <div
      className="min-h-screen flex flex-col items-center justify-center p-4"
      style={{
        background: "radial-gradient(ellipse at 30% 20%, #1a1f2e 0%, #0d1117 50%, #080b10 100%)",
        fontFamily: "'EB Garamond', serif",
      }}
    >
      {copyToast && (
        <div
          className="fixed top-6 left-1/2 px-5 py-2.5 rounded-lg text-sm z-50"
          style={{
            transform: "translateX(-50%)",
            background: "rgba(110,231,183,0.15)",
            border: "1px solid rgba(110,231,183,0.3)",
            color: "#6ee7b7",
            backdropFilter: "blur(12px)",
            animation: "toastIn 0.3s ease, toastOut 0.3s ease 1.5s forwards",
          }}
        >
          コピーしました！
        </div>
      )}

      <div className="w-full max-w-md">
        <div className="text-center mb-8">
          <h1 className="text-2xl font-medium tracking-wide" style={{ color: "#c9d1d9" }}>
            技能値補正計算
          </h1>
          <div className="mt-3 mx-auto" style={{ width: 40, height: 1, background: "linear-gradient(90deg, transparent, #4a5568, transparent)" }} />
        </div>

        <div
          className="rounded-2xl p-6"
          style={{
            background: "linear-gradient(145deg, rgba(22,27,40,0.9), rgba(13,17,23,0.95))",
            border: "1px solid rgba(255,255,255,0.06)",
            boxShadow: "0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04)",
          }}
        >
          {/* Skill Value */}
          <div className="mb-6">
            <div className="flex justify-between items-center mb-3">
              <label className="text-xs tracking-widest uppercase" style={{ color: "#64748b" }}>技能値</label>
              <div className="rounded-lg" style={{ border: "1px solid rgba(255,255,255,0.15)", background: "rgba(255,255,255,0.03)", padding: "4px 2px" }}>
                <input
                  type="text"
                  inputMode="numeric"
                  value={skillInput}
                  onChange={(e) => {
                    const raw = e.target.value.replace(/[^0-9]/g, "");
                    setSkillInput(raw);
                    const v = parseInt(raw);
                    if (!isNaN(v) && v >= 1 && v <= 99) setSkillValue(v);
                    else if (raw === "") setSkillValue(null);
                  }}
                  onBlur={() => {
                    if (skillInput === "") { setSkillValue(null); return; }
                    const v = parseInt(skillInput);
                    if (isNaN(v) || v < 1) { setSkillValue(1); setSkillInput("1"); }
                    else if (v > 99) { setSkillValue(99); setSkillInput("99"); }
                    else { setSkillValue(v); setSkillInput(String(v)); }
                  }}
                  className="w-14 text-center text-2xl font-light bg-transparent border-none outline-none tabular-nums"
                  style={{ color: "#e2e8f0" }}
                />
              </div>
            </div>
            <input
              type="range" min={1} max={99} value={hasSkill ? skillValue : 50}
              onChange={(e) => { const v = parseInt(e.target.value); setSkillValue(v); setSkillInput(String(v)); }}
              className="w-full h-1 rounded-full appearance-none cursor-pointer"
              style={{
                background: hasSkill
                  ? `linear-gradient(90deg, #475569 0%, #475569 ${skillValue}%, rgba(255,255,255,0.06) ${skillValue}%, rgba(255,255,255,0.06) 100%)`
                  : "linear-gradient(90deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.06) 100%)",
              }}
            />
            <div className="flex justify-between mt-1.5 text-xs tabular-nums" style={{ color: "#374151" }}>
              <span>1</span><span>99</span>
            </div>
          </div>

          {/* Dice Selector */}
          <div className="mb-6">
            <div className="flex justify-between items-center mb-3">
              <label className="text-xs tracking-widest uppercase" style={{ color: "#64748b" }}>ボーナス / ペナルティ</label>
              <span className="text-sm" style={{ color: diceColor }}>{diceLabel}</span>
            </div>

            <div className="flex items-center justify-center gap-3 mb-3">
              <button
                onClick={() => { const v = Math.max(-10, netDice - 1); setNetDice(v); setDiceInput(String(v)); }}
                className="flex items-center justify-center rounded-lg"
                style={{ width: 36, height: 36, fontSize: 18, color: "#fca5a5", background: "rgba(252,165,165,0.08)", border: "1px solid rgba(252,165,165,0.2)" }}
              >−</button>
              <input
                type="text" inputMode="numeric" value={diceInput}
                onChange={(e) => {
                  const raw = e.target.value.replace(/[^0-9\-]/g, "");
                  setDiceInput(raw);
                  const v = parseInt(raw);
                  if (!isNaN(v) && v >= -10 && v <= 10) setNetDice(v);
                }}
                onBlur={() => {
                  const v = parseInt(diceInput);
                  if (isNaN(v)) { setNetDice(0); setDiceInput("0"); }
                  else if (v < -10) { setNetDice(-10); setDiceInput("-10"); }
                  else if (v > 10) { setNetDice(10); setDiceInput("10"); }
                  else { setNetDice(v); setDiceInput(String(v)); }
                }}
                className="w-16 text-center text-2xl font-light bg-transparent border-none outline-none tabular-nums"
                style={{ color: diceColor }}
              />
              <button
                onClick={() => { const v = Math.min(10, netDice + 1); setNetDice(v); setDiceInput(String(v)); }}
                className="flex items-center justify-center rounded-lg"
                style={{ width: 36, height: 36, fontSize: 18, color: "#6ee7b7", background: "rgba(110,231,183,0.08)", border: "1px solid rgba(110,231,183,0.2)" }}
              >+</button>
            </div>

            <input
              type="range" min={-10} max={10} value={netDice}
              onChange={(e) => { const v = parseInt(e.target.value); setNetDice(v); setDiceInput(String(v)); }}
              className="w-full h-1 rounded-full appearance-none cursor-pointer"
              style={{
                background: (() => {
                  const pct = ((netDice + 10) / 20) * 100;
                  const mid = 50;
                  if (netDice === 0) return "linear-gradient(90deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.06) 100%)";
                  if (netDice > 0) return `linear-gradient(90deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.06) ${mid}%, #6ee7b7 ${mid}%, #6ee7b7 ${pct}%, rgba(255,255,255,0.06) ${pct}%, rgba(255,255,255,0.06) 100%)`;
                  return `linear-gradient(90deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.06) ${pct}%, #fca5a5 ${pct}%, #fca5a5 ${mid}%, rgba(255,255,255,0.06) ${mid}%, rgba(255,255,255,0.06) 100%)`;
                })(),
              }}
            />
            <div className="flex justify-between mt-1.5 text-xs tabular-nums" style={{ color: "#374151" }}>
              <span>−10</span><span>0</span><span>+10</span>
            </div>

            <div style={{ height: 40 }} className="flex items-center justify-center mt-1">
              {netDice !== 0 && (
                <p className="text-center text-xs" style={{ color: "#4a5568" }}>
                  <span style={{ color: diceColor, fontWeight: 500 }}>d10×{Math.abs(netDice) + 1}</span>
                  <span className="mx-1.5">—</span>
                  {netDice > 0 ? "十の位ダイスの最小値を採用" : "十の位ダイスの最大値を採用"}
                </p>
              )}
            </div>
          </div>

          <div style={{ height: 1, background: "rgba(255,255,255,0.04)" }} />

          {/* Bottom fixed section */}
          <div style={{ height: 320, overflow: "hidden", display: "flex", flexDirection: "column" }}>
            <div className="flex-1 flex flex-col justify-center">
              {!hasSkill ? (
                <p className="text-sm text-center" style={{ color: "#4a5568" }}>技能値を入力してください。</p>
              ) : netDice === 0 ? (
                <p className="text-sm text-center" style={{ color: "#4a5568" }}>ボーナスまたはペナルティダイスを設定すると<br />補正値が表示されます。</p>
              ) : results && (
                <div className="text-center">
                  <div className="mb-4">
                    <div className="text-xs tracking-widest uppercase mb-3" style={{ color: "#64748b" }}>補正値</div>
                    <div
                      className="text-6xl font-semibold tabular-nums"
                      style={{
                        color: results.correction >= 0 ? "#6ee7b7" : "#fca5a5",
                        textShadow: `0 0 30px ${results.correction >= 0 ? "rgba(110,231,183,0.3)" : "rgba(252,165,165,0.3)"}`,
                        lineHeight: 1.1,
                      }}
                    >
                      {results.correction >= 0 ? "+" : ""}{results.correction}
                    </div>
                  </div>

                  <div className="rounded-xl p-3 mb-4" style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.04)" }}>
                    <div className="grid grid-cols-3 gap-2">
                      <div>
                        <div className="text-xs mb-0.5" style={{ color: "#4a5568" }}>7版期待成功率</div>
                        <div className="text-base tabular-nums" style={{ color: "#60a5fa" }}>{(results.prob * 100).toFixed(2)}%</div>
                      </div>
                      <div>
                        <div className="text-xs mb-0.5" style={{ color: "#4a5568" }}>デルタ</div>
                        <div className="text-base tabular-nums" style={{ color: results.delta >= 0 ? "#6ee7b7" : "#fca5a5" }}>
                          {results.delta >= 0 ? "+" : ""}{results.delta.toFixed(2)}%
                        </div>
                      </div>
                      <div>
                        <div className="text-xs mb-0.5" style={{ color: "#4a5568" }}>補正後技能値</div>
                        <div className="text-base font-medium tabular-nums" style={{ color: "#e2e8f0" }}>{results.corrected}</div>
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={handleCopy}
                    className="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm"
                    style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", color: "#94a3b8", cursor: "pointer", fontFamily: "'EB Garamond', serif" }}
                  >
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                    </svg>
                    <span className="tabular-nums" style={{ letterSpacing: "0.02em" }}>
                      CCB&lt;={skillValue}{results.correction >= 0 ? `+${results.correction}` : results.correction}
                    </span>
                  </button>

                  <p className="text-xs mt-3" style={{ color: "#374151" }}>小数点以下切り捨て ・ 補正後は 1〜99 にクランプ</p>
                </div>
              )}
            </div>

            {showResults && (
              <div style={{ flexShrink: 0 }}>
                <div style={{ height: 1, background: "rgba(255,255,255,0.04)" }} />
                <button
                  onClick={() => setShowRef(!showRef)}
                  className="w-full flex items-center justify-between py-2 text-xs tracking-widest uppercase"
                  style={{ color: "#4a5568", background: "none", border: "none", cursor: "pointer", fontFamily: "'EB Garamond', serif" }}
                >
                  <span>7版参考データ</span>
                  <span style={{ fontSize: 14, transition: "transform 0.2s", transform: showRef ? "rotate(180deg)" : "rotate(0)" }}>▾</span>
                </button>
              </div>
            )}
          </div>

          {showResults && showRef && (
            <div className="mt-1 mb-2" style={{ animation: "fadeIn 0.2s ease" }}>
              <div className="grid grid-cols-1 gap-y-2 text-sm">
                <div className="flex justify-between">
                  <span style={{ color: "#4a5568" }}>レギュラー成功（≤ {skillValue}）</span>
                  <span className="tabular-nums" style={{ color: "#60a5fa" }}>{(results.prob * 100).toFixed(1)}%</span>
                </div>
                <div className="flex justify-between">
                  <span style={{ color: "#4a5568" }}>ハード成功（≤ {results.hard.threshold}）</span>
                  <span className="tabular-nums" style={{ color: "#a78bfa" }}>{(results.hard.prob * 100).toFixed(1)}%</span>
                </div>
                <div className="flex justify-between">
                  <span style={{ color: "#4a5568" }}>イクストリーム成功（≤ {results.extreme.threshold}）</span>
                  <span className="tabular-nums" style={{ color: "#f472b6" }}>{(results.extreme.prob * 100).toFixed(1)}%</span>
                </div>
                <div className="flex justify-between">
                  <span style={{ color: "#4a5568" }}>クリティカル（= 01）</span>
                  <span className="tabular-nums" style={{ color: "#fbbf24" }}>{results.critical.toFixed(2)}%</span>
                </div>
                <div className="flex justify-between">
                  <span style={{ color: "#4a5568" }}>ファンブル（= 100）</span>
                  <span className="tabular-nums" style={{ color: "#ef4444" }}>{results.fumble.toFixed(2)}%</span>
                </div>
              </div>
            </div>
          )}
        </div>

        <div className="text-center mt-6">
          <div className="text-xs leading-relaxed" style={{ color: "#2d3748" }}>
            当ツールは「Chaosium Inc.」「株式会社アークライト」「株式会社KADOKAWA」が<br />
            権利を有する『クトゥルフ神話TRPG』の二次創作物です。<br />
            ©Chaosium Inc.／アークライト／KADOKAWA
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
